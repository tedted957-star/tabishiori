<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f7a6d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅しおり">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>旅しおり</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f2ea; --card:#fffdf9; --ink:#2a2824; --sub:#6f6a61; --line:#e6dfd2;
  --accent:#1f7a6d; --accent-soft:#dcefe9; --sun:#d9663f; --sun-soft:#fbe6dc;
  --car:#3b6fb6; --walk:#7a8f3a; --train:#1f7a6d;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 90px)}
header.top{display:flex;align-items:flex-start;gap:10px;padding:10px 2px 6px}
header.top .t{flex:1;min-width:0}
header.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.02em;overflow-wrap:anywhere}
header.top .meta{color:var(--sub);font-size:13px}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}
.banner{background:var(--sun-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin:8px 0;color:#7a3a20}
.banner.info{background:var(--accent-soft);color:#14524a}
.days{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:8px 0}
.sum{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px}
.sum .b{flex:1;min-width:90px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.sum .b .k{font-size:11px;color:var(--sub)}
.sum .b .v{font-size:17px;font-weight:700}
.stop{display:flex;gap:10px;align-items:flex-start}
.stop .time{width:46px;flex:none;font-weight:700;font-size:14px;padding-top:2px}
.stop .body{flex:1;min-width:0}
.stop h3{margin:0;font-size:16px;overflow-wrap:anywhere}
.stop .place{color:var(--sub);font-size:13px;overflow-wrap:anywhere}
.stop .memo{font-size:13px;margin-top:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.stop img.ph{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:12px;border-radius:8px;padding:2px 8px;background:#f0ebe1;color:var(--sub)}
.tag.bk{background:#efe7ff;color:#5a3fa0}
.tag.cost{background:#fff3cf;color:#7a5a00}
.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.lk{font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:#fff;color:var(--ink);cursor:pointer}
.lk.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.stay{border-left:4px solid var(--sun)}
.leg{margin:-2px 0 -2px 22px;border-left:2px dashed #cfc6b5;padding:6px 0 6px 16px;font-size:12.5px;color:var(--sub)}
.leg .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.leg .best{font-weight:700;color:var(--ink)}
.leg .opt{opacity:.75}
.leg a{font-size:12px}
.mode-walk{color:var(--walk)} .mode-car{color:var(--car)} .mode-transit{color:var(--train)}
.btn{border:none;border-radius:12px;padding:11px 14px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;width:100%}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:#b8452a}
.btn:disabled{opacity:.5}
.row2{display:flex;gap:8px}
.row2>*{flex:1}
.small{font-size:12px;color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:30px 10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,249,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;border:none;background:none;padding:8px 0 9px;font-size:11px;color:var(--sub);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:20px;line-height:1}
nav.tabs button.on{color:var(--accent);font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(30,25,20,.4);z-index:40;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:18px 18px 0 0;z-index:41;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);display:none;max-width:640px;margin:0 auto}
.sheet.open,.sheet-bg.open{display:block}
.sheet h2{margin:0 0 10px;font-size:18px}
.f{margin:10px 0}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
.f textarea{min-height:70px;resize:vertical}
.ai{background:linear-gradient(135deg,#eaf5f1,#fdf1ea);border:1px dashed #9cc9bd;border-radius:12px;padding:10px;margin:10px 0;font-size:13px}
.ai .btn{margin-top:6px;background:#2d6b88}
.status{font-size:12px;color:var(--sub);margin-top:6px;min-height:1em}
.mapbox{background:#eef3ee;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:6px 2px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13.5px;margin-top:6px}
.kv .k{color:var(--sub)}
.bkrow{display:flex;align-items:center;gap:10px}
.bkrow .n{font-family:ui-monospace,Menlo,monospace;font-size:16px;font-weight:700;letter-spacing:.04em;overflow-wrap:anywhere}
.table{width:100%;border-collapse:collapse;font-size:13.5px}
.table td{padding:6px 2px;border-bottom:1px solid var(--line);vertical-align:top}
.table td.r{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.table tr.tot td{font-weight:700;border-bottom:none;padding-top:10px}
.who{font-size:12px;color:var(--sub);text-align:right;margin-top:-4px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 80px);transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;z-index:60;display:none}
.ordbtns{display:flex;flex-direction:column;gap:4px}
.ordbtns button{border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:26px;cursor:pointer;font-size:12px;padding:0}
.hidden{display:none!important}

#gmapWrap{height:62vh;min-height:320px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:#e8eee8}
#gmap{width:100%;height:100%}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:20px}
.login img{width:96px;height:96px;border-radius:24px}
.gbtn{display:flex;align-items:center;gap:10px;border:1px solid #dadce0;background:#fff;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;font-size:15px}
.res{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:8px;margin:6px 0;background:#fff}
.res img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none;background:#eee}
.res .noimg{width:72px;height:72px;border-radius:8px;flex:none;background:#eee;display:grid;place-items:center;font-size:24px}
.res .bd{flex:1;min-width:0;font-size:13px}
.res b{font-size:14px}
.credit{font-size:10.5px;color:var(--sub);margin-top:2px}
.real{font-size:10.5px;background:#e3f1ec;color:#14524a;border-radius:6px;padding:1px 5px;margin-left:4px;font-weight:500}
.avatars{display:flex;gap:4px;flex-wrap:wrap}
.av{display:flex;align-items:center;gap:6px;font-size:13px;background:#f0ebe1;border-radius:999px;padding:3px 10px 3px 3px}
.av img,.av span.i{width:24px;height:24px;border-radius:50%;object-fit:cover;background:#ccc;display:inline-grid;place-items:center;font-size:12px;color:#fff}
</style>
</head>
<body>
<div class="wrap">
  <header class="top hidden" id="hdr">
    <div class="t">
      <h1 id="tripTitle" role="button" tabindex="0" style="cursor:pointer">旅しおり</h1>
      <div class="meta" id="tripMeta"></div>
    </div>
    <button class="iconbtn" id="btnShare" aria-label="LINEで送る" style="background:#06c755;border-color:#06c755;color:#fff;font-size:11px;font-weight:700">LINE</button>
    <button class="iconbtn" id="btnSettings" aria-label="旅行の設定">⚙️</button>
  </header>
  <div id="notice"></div>
  <main id="view"><div class="empty">読み込み中…</div></main>
</div>
<nav class="tabs hidden" id="tabs"><div class="in">
  <button data-tab="plan" class="on"><span class="ic">🗓️</span>旅程</button>
  <button data-tab="map"><span class="ic">🗺️</span>マップ</button>
  <button data-tab="stay"><span class="ic">🏨</span>宿</button>
  <button data-tab="cost"><span class="ic">💴</span>費用</button>
  <button data-tab="book"><span class="ic">🎫</span>予約</button>
</div></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>

<script>if('serviceWorker' in navigator && location.protocol==='https:'){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }</script>
</body>
</html>
